# Publish this server to the MCP Registry.
#
# The listing is `com.datatreehaus/skopia-floor-plan-layout`, a domain
# namespace, so the credential is an Ed25519 key whose PUBLIC half is served
# at https://datatreehaus.com/.well-known/mcp-registry-auth and whose private
# half is the repository secret MCP_REGISTRY_KEY. GitHub OIDC cannot publish
# under this namespace; it only ever proved `io.github.*`.
#
# If the key is ever lost, nothing is stranded: generate a fresh pair, put the
# new public half in that well-known file, redeploy datatreehaus.com, and set
# the secret again. Rotating does not disturb the listing that is already up.
#
# It fires on a version tag, so publishing is a deliberate act:
#   git tag v0.1.0 && git push origin v0.1.0
#
# The version in server.json is overwritten from the tag, so the tag is the
# single source of truth and the two can never disagree.

name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # so a first publish can be run from the Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      # The endpoint must be publicly reachable before it is listed. The
      # registry says a remote server MUST be available at its URL, and a
      # dead listing is worse than none.
      - name: Check the endpoint is alive
        run: |
          URL=$(jq -r '.remotes[0].url' server.json)
          echo "Probing $URL"
          code=$(curl -sS -o /tmp/probe.json -w '%{http_code}' "$URL" \
            -H 'content-type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: server/discover' \
            -d '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{
                 "io.modelcontextprotocol/protocolVersion":"2026-07-28",
                 "io.modelcontextprotocol/clientCapabilities":{}}}}')
          test "$code" = "200" || { echo "endpoint returned $code"; cat /tmp/probe.json; exit 1; }
          jq -e '.result.supportedVersions | index("2026-07-28")' /tmp/probe.json > /dev/null
          echo "endpoint healthy"

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json
          echo "publishing $VERSION"

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # The key, in whatever form it was saved. mcp-publisher wants the 64-hex
      # Ed25519 seed and nothing else, and the first two attempts to set this
      # secret (2026-09-15) were a PEM and a base64 body, each refused with
      # "invalid hex private key format" and a single offending byte — no
      # help to somebody setting a secret from a phone. So the runner reads
      # hex, a PKCS#8 PEM, that PEM's base64 body, or an OpenSSH private key,
      # derives the seed, and then checks its PUBLIC half against the one at
      # datatreehaus.com/.well-known/mcp-registry-auth — which is what the
      # registry will verify with. A wrong key fails HERE, naming the form it
      # was read as and the public half it actually carries, never the value.
      - name: Read the signing key
        id: key
        run: |
          test -n "$MCP_KEY" || { echo "::error::MCP_REGISTRY_KEY is not set"; exit 1; }
          # The SHAPE of what was saved, so a refusal can be acted on from a
          # phone. Length, line count and character classes say what kind of
          # thing it is; none of it is the value.
          len=${#MCP_KEY}; lines=$(printf '%s' "$MCP_KEY" | grep -c '' || true)
          first=$(printf '%s' "$MCP_KEY" | tr -d '[:space:]' | cut -c1)
          case "$first" in [0-9a-fA-F]) fc="a hex digit";; [A-Za-z]) fc="the letter '$first'";; -) fc="a dash";; *) fc="'$first'";; esac
          flags=""
          printf '%s' "$MCP_KEY" | grep -q 'priv:' && flags="$flags openssl-text"
          printf '%s' "$MCP_KEY" | grep -q -- '-----BEGIN' && flags="$flags pem-armour"
          printf '%s' "$MCP_KEY" | grep -q '[+/=]' && flags="$flags base64-symbols"
          printf '%s' "$MCP_KEY" | grep -q ':' && flags="$flags colons"
          printf '%s' "$MCP_KEY" | grep -q ' ' && flags="$flags spaces"
          echo "MCP_REGISTRY_KEY shape: $len chars, $lines line(s), starts with $fc, has:${flags:- nothing notable}"

          flat=$(printf '%s' "$MCP_KEY" | tr -d '[:space:]')
          hex=""; form=""
          if printf '%s' "$flat" | grep -qE '^[0-9a-fA-F]{64}$'; then
            form=hex; hex=$(printf '%s' "$flat" | tr 'A-F' 'a-f')
          elif printf '%s' "$MCP_KEY" | grep -q 'priv:'; then
            # `openssl pkey -text` output: "priv:" then colon-separated bytes.
            form=openssl-text
            hex=$(printf '%s\n' "$MCP_KEY" | sed -n '/priv:/,/pub:/p' | grep -v 'priv:\|pub:' | tr -d ' :\n\r\t')
          elif [ "$(printf '%s' "$flat" | base64 -d 2>/dev/null | wc -c)" = 32 ]; then
            # The raw seed, base64.
            form=base64-seed
            hex=$(printf '%s' "$flat" | base64 -d | od -An -v -tx1 | tr -d ' \n')
          else
            pem=""
            case "$flat" in
              -----BEGINOPENSSH*)
                form=openssh
                umask 077; printf '%s\n' "$MCP_KEY" > k.ssh
                ssh-keygen -p -N '' -m PKCS8 -f k.ssh >/dev/null 2>&1 && pem=$(cat k.ssh) || true
                rm -f k.ssh;;
              -----BEGIN*)
                form=pem; pem=$(printf '%s\n' "$MCP_KEY");;
              *)
                form=base64
                pem=$(printf -- '-----BEGIN PRIVATE KEY-----\n%s\n-----END PRIVATE KEY-----\n' "$(printf '%s' "$flat" | fold -w 64)");;
            esac
            if [ -n "$pem" ]; then
              # PKCS#8 DER for Ed25519 is a fixed 16-byte header, then the seed.
              hex=$(printf '%s\n' "$pem" | openssl pkey -outform DER 2>/dev/null | tail -c 32 | od -An -v -tx1 | tr -d ' \n') || true
            fi
          fi
          printf '%s' "$hex" | grep -qE '^[0-9a-f]{64}$' || {
            echo "::error::MCP_REGISTRY_KEY was read as '$form' but no Ed25519 private key could be derived from it. Set the 64-hex seed, a PKCS#8 PEM, or that PEM's base64 body."; exit 1; }
          echo "MCP_REGISTRY_KEY read as: $form"

          der=$(printf '302e020100300506032b657004220420%s' "$hex" | sed 's/../\\x&/g')
          pub=$(printf "$der" | openssl pkey -inform DER -pubout -outform DER 2>/dev/null | tail -c 32 | base64 | tr -d '\n')
          want=$(curl -sSf https://datatreehaus.com/.well-known/mcp-registry-auth | sed -n 's/.*p=\([A-Za-z0-9+/=]*\).*/\1/p' | head -1)
          if [ -z "$want" ]; then
            echo "::warning::could not read datatreehaus.com/.well-known/mcp-registry-auth; skipping the public-half check"
          elif [ "$pub" != "$want" ]; then
            echo "::error::MCP_REGISTRY_KEY is a valid Ed25519 key but NOT the one whose public half is served at datatreehaus.com/.well-known/mcp-registry-auth. Either set the key that published 0.1.0, or serve this key's public half there: $pub"; exit 1
          fi
          echo "the key matches the public half at datatreehaus.com"
          echo "::add-mask::$hex"
          echo "hex=$hex" >> "$GITHUB_OUTPUT"
        env:
          MCP_KEY: ${{ secrets.MCP_REGISTRY_KEY }}

      - name: Authenticate
        run: ./mcp-publisher login http --domain=datatreehaus.com --private-key="$MCP_HEX"
        env:
          MCP_HEX: ${{ steps.key.outputs.hex }}

      - name: Publish
        run: ./mcp-publisher publish
